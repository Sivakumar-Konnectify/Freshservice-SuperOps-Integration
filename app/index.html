<!DOCTYPE html>
<html>
<head>
  <script src="https://static.freshdev.io/fdk/2.0/assets/fresh_client.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@latest/dist/crayons.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/@freshworks/crayons@latest/dist/crayons.css"
      rel="stylesheet"
    />
  <link rel="stylesheet" href="./styles/styles.css"/>
</head>
<body>
  <div class="widget">
    <!-- VIEW 1: Asset List -->
    <div id="view-list" class="view active">
      <div id="asset-list-content">
        <div class="loading"><div class="spinner"></div> Loading assets…</div>
      </div>
    </div>

    <!-- VIEW 2: Asset Detail -->
    <div id="view-detail" class="view">
      <button class="back-btn" id="back-btn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M8.5 3.5L5 7L8.5 10.5" stroke="currentColor" stroke-width="1.3"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>

      <div class="asset-header">
        <div class="asset-header-icon">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="3" width="14" height="10" rx="2" stroke="#4285f4" stroke-width="1.2"/>
            <rect x="4" y="7" width="2" height="2" rx="0.5" fill="#4285f4"/>
            <rect x="7" y="7" width="2" height="2" rx="0.5" fill="#4285f4"/>
            <rect x="10" y="7" width="2" height="2" rx="0.5" fill="#4285f4"/>
          </svg>
        </div>
        <div>
          <div class="asset-header-name" id="detail-name"></div>
          <div class="asset-header-id" id="detail-id"></div>
        </div>
      </div>

      <p class="section-label">Actions</p>
      <div id="detail-actions-content">
        <div class="loading"><div class="spinner"></div> Fetching asset info…</div>
      </div>
    </div>
  </div>

  <script src="./scripts/app.js"></script>
</body>
</html>
